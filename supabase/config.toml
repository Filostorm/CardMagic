project_id = "cardmagic"

[auth]
site_url = "https://cardmagic.craftsmannsoftware.com"
additional_redirect_urls = [
  "https://cardmagic.craftsmannsoftware.com",
  "https://cardmagic.craftsmannsoftware.com/**",
  "https://craftsmannsoftware.com/internal/metrics",
  "https://craftsmannsoftware.com/internal/metrics/**",
  "http://localhost:8082/**",
  "http://localhost:3000/**"
]

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
secure_password_change = false
max_frequency = "1m0s"
otp_length = 8
otp_expiry = 3600

[functions.create-checkout-session]
verify_jwt = true

[functions.stripe-webhook]
verify_jwt = false

[functions.openai-generate-image]
verify_jwt = false

[functions.openai-edit-image]
verify_jwt = false

[functions.openai-fix-rules-text]
verify_jwt = false

[functions.generate-subject-matte]
verify_jwt = false
